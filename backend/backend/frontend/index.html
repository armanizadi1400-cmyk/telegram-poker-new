<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Telegram Poker</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050806;color:#fff;font-family:Arial,sans-serif}
button{font-family:inherit;border:0;color:#fff;font-weight:800}
#app{height:100vh;background:radial-gradient(circle at 50% 35%,#174b30,#09130c 55%,#030503)}
.header{height:55px;padding:0 14px;display:flex;align-items:center;justify-content:space-between;background:#0008;border-bottom:1px solid #ffffff12}
.logo{font-size:19px;font-weight:900}.logo span{color:#65e993}
.status-wrap{display:flex;align-items:center;gap:6px}.status-dot{width:7px;height:7px;border-radius:50%;background:#f44}.status-dot.online{background:#55ed82;box-shadow:0 0 9px #55ed82}.status{font-size:11px;color:#aaa}

.table-area{height:calc(100vh - 200px);display:flex;align-items:center;justify-content:center;position:relative}
.table{width:92%;max-width:650px;aspect-ratio:1.62;position:relative;background:radial-gradient(circle,#199456,#0c7040 55%,#064528);border:11px solid #4a2b19;border-radius:50%;box-shadow:inset 0 0 45px #0008,0 20px 45px #000a}
.center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;width:65%}
.pot-label{font-size:9px;letter-spacing:1.5px;color:#ffffff99}.pot{font-size:21px;font-weight:900;margin-top:3px}.stage{display:inline-block;margin-top:5px;padding:4px 10px;border-radius:20px;background:#0004;font-size:9px;letter-spacing:1px;color:#fff9}
.community{display:flex;justify-content:center;gap:4px;margin-top:8px;min-height:50px}

.card{width:38px;height:53px;border-radius:6px;background:linear-gradient(145deg,#fff,#e8e8e8);color:#111;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:900;box-shadow:0 4px 9px #0007}
.card.red{color:#d51f38}.card.back{background:linear-gradient(135deg,#122755,#2857a5);border:2px solid white;color:#fff}

.player{position:absolute;width:105px;text-align:center;transform:translate(-50%,-50%);z-index:10}
.player-box{position:relative;background:#050a07dc;border:1px solid #ffffff22;border-radius:13px;padding:6px;box-shadow:0 5px 15px #0006}
.player.turn .player-box{border:2px solid #ffd63d;box-shadow:0 0 15px #ffd63d88}
.player.me .player-box{border-color:#3ca8ff}.player.folded{opacity:.4}
.player-name{font-size:10px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player-chips{font-size:8px;color:#cbd7cf;margin-top:3px}

.seat0{left:50%;bottom:-17px}.seat1{left:9%;bottom:10%}.seat2{left:4%;top:20%}
.seat3{left:50%;top:-17px}.seat4{right:-5%;top:20%}.seat5{right:0;bottom:10%}

.my-cards-area{position:absolute;left:50%;bottom:9px;transform:translateX(-50%);text-align:center;z-index:30}
.my-title{font-size:9px;letter-spacing:1.5px;color:#ffffff88;margin-bottom:5px}
.my-cards{display:flex;justify-content:center;gap:6px}

.controls{position:fixed;left:0;right:0;bottom:0;min-height:145px;padding:9px 11px 12px;background:#050806f7;border-top:1px solid #ffffff15;z-index:100}
.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
button{border-radius:11px;padding:12px 4px;font-size:12px}
button:disabled{opacity:.28}
.fold{background:#71363b}.check{background:#2c9658}.call{background:#337fbe}.raise{background:#bd851c}.allin{background:#c63d45}
.bottom{display:flex;justify-content:center;gap:7px;margin-top:8px}.small{padding:7px 14px;font-size:10px;background:#202722;color:#bdc8c0}

.start-screen{position:fixed;inset:0;z-index:200;background:radial-gradient(circle at 50% 35%,#184b30,#09120c 55%,#040604);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.start-screen.hidden{display:none}.start-logo{font-size:40px}.start-title{font-size:29px;font-weight:900;margin-top:10px}.start-sub{font-size:12px;color:#a9b7ae;margin-top:7px}
.start-info{display:flex;gap:7px;margin-top:18px}.info{padding:7px 10px;border-radius:20px;background:#ffffff0d;font-size:10px}
.start-button{margin-top:25px;width:230px;padding:16px;background:#159d58;font-size:17px}
.loading{position:fixed;inset:0;z-index:500;display:none;align-items:center;justify-content:center;background:#0009;font-size:14px}.loading.show{display:flex}
.toast{position:fixed;top:65px;left:50%;transform:translateX(-50%);background:#000e;padding:9px 15px;border-radius:12px;font-size:11px;opacity:0;z-index:600;transition:.2s}.toast.show{opacity:1}

@media(max-width:430px){
.table{width:94%;border-width:9px}.player{width:88px}.card{width:33px;height:46px;font-size:15px}.community .card{width:31px;height:43px;font-size:14px}.pot{font-size:17px}
}
</style>
</head>

<body>

<div id="app">

<div class="header">
<div class="logo">♠ <span>Telegram Poker</span></div>
<div class="status-wrap">
<div id="statusDot" class="status-dot"></div>
<div id="status">Connecting...</div>
</div>
</div>

<div class="table-area">
<div class="table">

<div id="seat0" class="player seat0"></div>
<div id="seat1" class="player seat1"></div>
<div id="seat2" class="player seat2"></div>
<div id="seat3" class="player seat3"></div>
<div id="seat4" class="player seat4"></div>
<div id="seat5" class="player seat5"></div>

<div class="center">
<div class="pot-label">CURRENT POT</div>
<div class="pot">🪙 <span id="pot">0</span></div>
<div id="stage" class="stage">WAITING</div>
<div id="community" class="community"></div>
</div>

</div>

<div class="my-cards-area">
<div class="my-title">YOUR CARDS</div>
<div id="myCards" class="my-cards"></div>
</div>
</div>

<div class="controls">
<div class="actions">
<button class="fold" onclick="action('fold')">FOLD</button>
<button class="check" onclick="action('check')">CHECK</button>
<button class="call" onclick="action('call')">CALL</button>
<button class="raise" onclick="raiseAction()">RAISE</button>
</div>

<div class="bottom">
<button class="small allin" onclick="action('allin')">ALL-IN</button>
<button class="small" onclick="refreshGame()">REFRESH</button>
<button class="small" onclick="leaveTable()">LEAVE</button>
</div>
</div>

</div>

<div id="startScreen" class="start-screen">
<div class="start-logo">♠ ♥ ♦ ♣</div>
<div class="start-title">Telegram Poker</div>
<div class="start-sub">Texas Hold'em · 6 Tables · Bots</div>
<div class="start-info">
<div class="info">👥 6 Players</div>
<div class="info">⏱ 20 sec</div>
<div class="info">🪙 1000 Chips</div>
</div>
<button class="start-button" onclick="startGame()">START GAME</button>
</div>

<div id="loading" class="loading">Connecting...</div>
<div id="toast" class="toast"></div>

<script>

const tg=window.Telegram.WebApp;
tg.ready();
tg.expand();

/* NEW BACKEND */
const API="https://telegram-poker-new2.onrender.com";

let userId=null;
let userName="Player";
let tableId=1;
let game=null;
let timer=null;

const TURN_SECONDS=20;

function getUser(){

    const u=tg.initDataUnsafe?.user;

    if(u){
        userId=String(u.id);
        userName=u.first_name||u.username||"Player";
        return;
    }

    let saved=localStorage.getItem("poker_test_user");

    if(!saved){
        saved="test_"+Math.floor(Math.random()*1000000);
        localStorage.setItem("poker_test_user",saved);
    }

    userId=saved;
    userName="Test Player";
}

function status(text,online){

    document.getElementById("status").innerText=text;

    const dot=document.getElementById("statusDot");

    dot.classList.toggle("online",online);
}

function toast(text){

    const el=document.getElementById("toast");

    el.innerText=text;
    el.classList.add("show");

    setTimeout(()=>el.classList.remove("show"),2200);
}

function loading(show){

    document.getElementById("loading")
        .classList.toggle("show",show);
}

async function request(path,options={}){

    const r=await fetch(API+path,{
        ...options,
        headers:{
            "Content-Type":"application/json",
            ...(options.headers||{})
        }
    });

    const data=await r.json();

    if(!r.ok){
        throw new Error(data.error||"Server error");
    }

    return data;
}

async function joinTable(){

    const data=await request("/join",{
        method:"POST",
        body:JSON.stringify({
            tableId:tableId,
            playerId:userId,
            name:userName
        })
    });

    status("Connected",true);

    return data;
}

async function refreshGame(){

    try{

        const data=await request(
            "/game/"+tableId+
            "?playerId="+
            encodeURIComponent(userId)
        );

        if(data.success){
            game=data.game;
            render(game);
            status("Connected",true);
        }

    }catch(e){

        console.error(e);
        status("Offline",false);

    }
}

async function startGame(){

    try{

        loading(true);

        await joinTable();
        await refreshGame();

        document
            .getElementById("startScreen")
            .classList.add("hidden");

        toast("♠ Joined table!");

    }catch(e){

        console.error(e);
        toast(e.message);

    }finally{

        loading(false);
    }
}

async function action(type,amount=0){

    if(!game || !game.started){
        toast("Game is not running");
        return;
    }

    if(game.currentPlayer!==userId){
        toast("It's not your turn");
        return;
    }

    try{

        loading(true);

        const data=await request("/action",{
            method:"POST",
            body:JSON.stringify({
                tableId:tableId,
                playerId:userId,
                action:type,
                amount:amount
            })
        });

        if(data.success){

            game=data.game;
            render(game);

        }else{

            toast(data.error||"Action failed");
        }

    }catch(e){

        toast(e.message);

    }finally{

        loading(false);
    }
}

function raiseAction(){

    if(!game || game.currentPlayer!==userId){
        toast("It's not your turn");
        return;
    }

    const current=Number(game.currentBet||20);

    const amount=prompt(
        "Raise to:",
        String(current+20)
    );

    if(!amount)return;

    const value=Number(amount);

    if(!Number.isFinite(value)){
        toast("Invalid amount");
        return;
    }

    action("raise",value);
}

async function leaveTable(){

    try{

        await request("/leave",{
            method:"POST",
            body:JSON.stringify({
                tableId:tableId,
                playerId:userId
            })
        });

        game=null;

        document
            .getElementById("startScreen")
            .classList.remove("hidden");

        renderEmpty();

        toast("Left table");

    }catch(e){

        toast(e.message);
    }
}

function cardElement(card,back=false){

    const el=document.createElement("div");
    el.className="card";

    if(back){

        el.classList.add("back");
        el.innerText="♠";

    }else{

        el.innerText=card;

        if(card.includes("♥")||card.includes("♦")){
            el.classList.add("red");
        }
    }

    return el;
}

function renderEmpty(){

    document.getElementById("pot").innerText="0";
    document.getElementById("stage").innerText="WAITING";
    document.getElementById("community").innerHTML="";
    document.getElementById("myCards").innerHTML="";

    for(let i=0;i<6;i++){
        document.getElementById("seat"+i).innerHTML="";
    }
}

function renderPlayers(players){

    for(let i=0;i<6;i++){

        const seat=document.getElementById("seat"+i);

        seat.innerHTML="";
        seat.className="player seat"+i;

        const p=players[i];

        if(!p)continue;

        if(p.id===userId)
            seat.classList.add("me");

        if(p.isTurn)
            seat.classList.add("turn");

        if(p.folded)
            seat.classList.add("folded");

        const box=document.createElement("div");
        box.className="player-box";

        const name=document.createElement("div");
        name.className="player-name";
        name.innerText=p.name+(p.isBot?" 🤖":"");

        const chips=document.createElement("div");
        chips.className="player-chips";
        chips.innerText="🪙 "+
            Number(p.chips||0).toLocaleString();

        box.appendChild(name);
        box.appendChild(chips);

        if(p.isTurn){

            const timer=document.createElement("div");
            timer.style.marginTop="3px";
            timer.style.color="#ffd63d";
            timer.style.fontSize="10px";
            timer.innerText="YOUR TURN";

            box.appendChild(timer);
        }

        seat.appendChild(box);
    }
}

function render(game){

    if(!game)return;

    document.getElementById("pot").innerText=
        Number(game.pot||0).toLocaleString();

    document.getElementById("stage").innerText=
        String(game.stage||"waiting").toUpperCase();

    renderPlayers(game.players||[]);

    const community=
        document.getElementById("community");

    community.innerHTML="";

    (game.communityCards||[]).forEach(card=>{
        community.appendChild(cardElement(card));
    });

    const mine=
        document.getElementById("myCards");

    mine.innerHTML="";

    const me=(game.players||[])
        .find(p=>p.id===userId);

    if(me && me.cards && me.cards.length){

        me.cards.forEach(card=>{
            mine.appendChild(cardElement(card));
        });

    }else{

        if(game.started){

            mine.appendChild(cardElement("",true));
            mine.appendChild(cardElement("",true));

        }
    }

    if(game.started){

        document
            .getElementById("startScreen")
            .classList.add("hidden");

    }else if(!game.winner){

        document
            .getElementById("startScreen")
            .classList.remove("hidden");
    }

    if(game.message){
        toast(game.message);
    }
}

async function init(){

    getUser();

    try{

        await joinTable();
        await refreshGame();

    }catch(e){

        console.error(e);

        status("Offline",false);

        toast("Unable to connect");
    }

    if(timer)
        clearInterval(timer);

    timer=setInterval(refreshGame,1000);
}

init();

</script>

</body>
</html>
